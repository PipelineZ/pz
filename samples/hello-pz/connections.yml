crm:
  connector: localfiles
  entities:
    # An entity's read options live here, or at the source() call that reads it -- never both
    # (PZ0341). `orders` is declared here because two things want it stable; `customers` is
    # declared at its call site in orders_enriched.sql, where the only pipeline reading it lives.
    orders:
      read:
        path: data/orders.csv
        format: csv
        columns:
          id: bigint
          customer_id: bigint
          amount: double
          status: varchar

lake:
  connector: localfiles
  # Where this lake is. Every write lands under it, in a directory named after the entity --
  # `orders_curated` becomes out/orders_curated/. A `path:` kwarg on the sink() call overrides
  # that per entity; an absolute one ignores `root:` entirely.
  root: out

ShortDescription: A lightweight, developer-first batch data pipeline engine for SQL-based ETL/ELT, powered by DuckDB, that runs anywhere without requiring a data platform.
Description: >-
  PipelineZ (pz) is a lightweight, developer-first batch data pipeline engine for SQL-based ETL/ELT,
  powered by DuckDB, that can run anywhere without requiring a data platform. Describe your pipeline
  in plain SQL files; pz compiles them into a dependency-ordered DAG and executes it in-process.
  Bundles connectors for local files, S3, Azure Blob, Google Cloud Storage, Postgres, SQL Server,
  MySQL, SQLite, DuckDB, DuckLake, Apache Iceberg, Quack, MotherDuck and HTTP.

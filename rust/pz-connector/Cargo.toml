[package]
name = "pz-connector"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "SDK for writing PipelineZ (pz) out-of-process connectors (PCP) in Rust."

[dependencies]
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
arrow = { version = "53", default-features = false, features = ["ipc"] }
async-trait = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
getrandom = "0.2"
anyhow = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tonic-build = "0.12"

[[example]]
name = "memory_sink"
path = "examples/memory_sink.rs"

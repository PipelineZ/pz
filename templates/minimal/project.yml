name: pz_new_project
version: 0.1.0

# Builtin connectors (localfiles, postgres, s3, sqlserver, azureblob, http, mysql, sqlite) need no
# declaration. A connector shipped as a NuGet package does:
#
# connectors:
#   - package: Some.Connector.Package
#     version: 1.0.0

# Reclaim disk automatically: after each run, delete staging.duckdb from all but
# the newest 10 runs. Run history (run_results.json) is always kept. `retention: off`
# disables it; `pz clean` does the same sweep on demand.
retention:
  keep_last: 10

name: ci

on:
  push:
    branches: [main, 'feat/**']
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Pz.slnx -c Release
      # Both legs run the full suite. On ubuntu, Linux Docker lets every Testcontainers suite
      # (Postgres/MinIO/Azurite) actually RUN. The windows runner's Docker daemon answers but runs
      # Windows containers, which DockerFacts counts as no docker, so those suites SKIP there and
      # everything else -- the PCP host over AF_UNIX, file locking, ACLs, paths, line endings -- runs
      # on Windows for real. PZ_TESTS_OFFLINE=1 skips network-dependent tests (e.g. the live
      # api.github.com smoke, whose SkipIfOffline() gate keys only on this env var) to keep CI hermetic
      # -- the stub-server suites cover the same logic offline.
      # --blame-hang: a hung test must name itself. On 2026-07-22 a run sat silent for 25 minutes
      # (last suite output 11:38, workflow-level cancel 12:07) and the log couldn't say which test
      # stalled -- passing tests print nothing at normal verbosity, so silence hides the culprit.
      # With a 10m per-suite ceiling (longest suite is ~2m here), vstest kills the hung run, dumps
      # every thread's stack, and prints the in-flight test names instead.
      - run: dotnet test Pz.slnx -c Release --no-build --filter "Category!=DuckDbExtension" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini
        env:
          PZ_TESTS_OFFLINE: '1'
      # --blame-hang names the hung test in the log, but the thread stacks that say WHY it hung are in
      # the dump and sequence files it writes under TestResults/, which die with the runner unless
      # they are kept. A rare hang is only diagnosable from the one run that showed it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: hang-blame-${{ matrix.os }}
          path: '**/TestResults/**'
          if-no-files-found: ignore
          retention-days: 7

  # The packaging end-to-end proof (pack -> local-feed tool install -> offline `pz init` -> offline
  # `pz run`) runs here rather than only locally: it is the one gate on the install path a
  # stranger's first five commands depend on, and an install path nothing checks will silently rot.
  # fetch-depth: 0 because MinVer computes package versions from tag history inside the
  # script's `dotnet pack`.
  pack-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: scripts/verify-tool-install.sh
      # The offline VM bundle is the install path for a machine with no nuget.org access, and it was
      # only ever run by hand when cutting a release -- so its packable-set guard drifted unnoticed
      # until it failed outright (it asserted 8 packages against an actual 12, once the MySQL and
      # SQLite connectors landed). Gating it here costs one more Release build+pack and means the
      # next connector cannot silently break the release path. RUNNER_TEMP keeps the zip out of the
      # working tree. `zip` is present on the ubuntu runner image; the script fails loudly if not.
      - run: scripts/make-release-bundle.sh "${RUNNER_TEMP}/release-bundle"

  # xlsx/avro ride DuckDB's excel/avro extensions, which `install` downloads on first use -- so their
  # tests need network and are excluded from the hermetic build-test job. This job runs exactly that
  # category with network, so the two extension formats are gated in CI rather than only locally.
  format-extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build tests/Pz.Connector.LocalFiles.Tests -c Release
      - run: dotnet build tests/Pz.DuckDb.Tests -c Release
      - run: dotnet test tests/Pz.Connector.LocalFiles.Tests -c Release --no-build --filter "Category=DuckDbExtension" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini
      - run: dotnet test tests/Pz.DuckDb.Tests -c Release --no-build --filter "Category=DuckDbExtension" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini

  # The Native AOT runtime proof, host side then connector side: verify-aot.sh publishes the
  # linux-x64 native image and drives init/run/restore/PZ0360/PCP-spawn/MCP against it;
  # verify-sdk-package.sh publishes the SDK fixture through Pz.Connectors.Sdk's packaging targets and
  # takes the resulting package all the way to a conformance-tested run. The AOT *compile-time*
  # analyzers already gate every build (TreatWarningsAsErrors), but the six third-party assemblies
  # whose internals warn (see Pz.Cli.csproj) can only be proven safe by running the paths that cross
  # them -- which the ordinary test suite never does, since tests run on CoreCLR.
  verify-aot:
    runs-on: ubuntu-latest
    # 30 was the budget for the host-side proof alone; the connector-side one adds a second Native
    # AOT compilation plus a self-contained publish and two packs.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: scripts/verify-aot.sh
      # The connector-side packaging proof: the fixture published through Pz.Connectors.Sdk's targets
      # (AOT, then self-contained), packed, restored from a local feed, run, and conformance-tested.
      # Lives in this job because it needs the same Native AOT toolchain.
      - run: scripts/verify-sdk-package.sh

  # The Rust workspace's own gate: absent from build-test/pack-and-verify above so a contributor
  # without cargo still gets a green build-test. fmt/clippy/test cover rust/ itself; the conformance
  # script covers the boundary with the .NET host, which nothing else in this workflow exercises.
  # The windows leg exists because the SDK's transport has a Windows-only half (src/transport.rs):
  # clippy, the crate's tests and the conformance script run there too. fmt and cargo-audit are
  # platform-independent and stay on ubuntu.
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 30 was the budget before cargo-audit; a cache-cold cargo-audit install compiles its own
    # dependency tree (including aws-lc-sys) from source, adding several minutes on the first run
    # after the pinned version changes -- rust-cache's ~/.cargo/bin cache makes every run after that
    # a no-op reinstall.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      # tonic-build (rust/pz-connector/build.rs) shells out to protoc to compile the PCP .proto
      # contract; nothing here vendors a protoc binary.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
        if: runner.os == 'Linux'
      # Pinned release zip, verified against its published SHA-256; the runner image carries no protoc.
      - name: Install protoc (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\protoc.zip"
          Invoke-WebRequest https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-win64.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'F0C128DC0D8492ECEECE83BB459A4C0E316764B929FFBF1AA416357FD644EDD3') { throw 'protoc zip hash mismatch' }
          Expand-Archive $zip "$env:RUNNER_TEMP\protoc"
          "PROTOC=$env:RUNNER_TEMP\protoc\bin\protoc.exe" >> $env:GITHUB_ENV
      - run: cargo fmt --all -- --check
        if: runner.os == 'Linux'
        working-directory: rust
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test --workspace
        working-directory: rust
      # Version-pinned so the job installs the same cargo-audit build every run; rust-cache above
      # caches ~/.cargo/bin (cache-bin defaults to true), so this only compiles on a cache miss.
      # RUSTSEC advisories change over time -- a currently-clean workspace can start failing here
      # without any dependency bump in this repo, which is the point: it is the same signal
      # Dependabot's grouped nuget/cargo/github-actions PRs (.github/dependabot.yml) exist to let a
      # human act on quickly.
      - run: cargo install cargo-audit --locked --version 0.22.2
        if: runner.os == 'Linux'
      - run: cargo audit
        if: runner.os == 'Linux'
        working-directory: rust
      - run: scripts/rust-conformance.sh
        shell: bash
      # See build-test's identical step: what --blame-hang wrote is lost with the runner otherwise.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: hang-blame-rust-${{ matrix.os }}
          path: '**/TestResults/**'
          if-no-files-found: ignore
          retention-days: 7

files:
  connector: localfiles
  entities:
    orders:
      read:
        path: data/orders.csv
        format: csv
        columns:
          id: bigint
          customer: varchar
          amount: double
        sync:
          mode: incremental
          cursor: id
          max_window: "2"
          initial: "0"
          until: "6"

lake:
  connector: localfiles

name: azure-live

# The opt-in lane against a real storage account over HTTPS. Azurite speaks plain http, so the
# build-test suites never exercise TLS: a transport that cannot find the CA bundle stays green there
# and fails on every real Linux host. Auth is OIDC federation (no stored key): the app registration
# behind AZURE_CLIENT_ID needs Storage Blob Data Contributor on the container, and federated
# credentials for this repo's main branch and pull_request subjects. Every job is skipped until the
# repository variable PZ_TEST_AZURE_ACCOUNT is set.

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'connectors/Pz.Connector.AzureBlob/**'
      - 'connectors/Pz.Connector.Iceberg/**'
      - 'tests/Pz.Connector.AzureBlob.Tests/**'
      - 'tests/Pz.Connector.Iceberg.Tests/**'
      - 'tests/Pz.TestSupport/LiveAzure.cs'
      - '.github/workflows/azure-live.yml'
  pull_request:
    paths:
      - 'connectors/Pz.Connector.AzureBlob/**'
      - 'connectors/Pz.Connector.Iceberg/**'
      - 'tests/Pz.Connector.AzureBlob.Tests/**'
      - 'tests/Pz.Connector.Iceberg.Tests/**'
      - 'tests/Pz.TestSupport/LiveAzure.cs'
      - '.github/workflows/azure-live.yml'

concurrency:
  group: azure-live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  azure-live:
    # Fork PRs get no OIDC token for this repo's federated credential.
    if: >-
      vars.PZ_TEST_AZURE_ACCOUNT != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PZ_TEST_AZURE_ACCOUNT: ${{ vars.PZ_TEST_AZURE_ACCOUNT }}
      PZ_TEST_AZURE_CONTAINER: ${{ vars.PZ_TEST_AZURE_CONTAINER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: dotnet build tests/Pz.Connector.AzureBlob.Tests -c Release
      - run: dotnet build tests/Pz.Connector.Iceberg.Tests -c Release
      - run: dotnet test tests/Pz.Connector.AzureBlob.Tests -c Release --no-build --filter "Category=AzureLive" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini
      - run: dotnet test tests/Pz.Connector.Iceberg.Tests -c Release --no-build --filter "Category=AzureLive" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini

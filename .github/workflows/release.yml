# NuGet trusted publishing (OIDC) -- no long-lived API key secret is stored
# in this repo. MANUAL PREREQUISITES (one-time; see CONTRIBUTING.md "Release process" for the full
# walkthrough):
#   1. On nuget.org (https://www.nuget.org/account/trustedpublishing -> Add policy), create ONE trusted
#      publishing policy naming this repository's owner/name, this exact workflow filename
#      ("release.yml", no path), and environment "release". Scope it with the package glob "Pz.*" and
#      the "Push new packages and package versions" scope -- not "push only new package versions",
#      which cannot create an id that does not exist yet. On a private repo it stays "temporarily
#      active" for 7 days until a successful publish binds it to the GitHub repo/owner IDs.
#   1b. Cover the tool packages too: the tool publishes as "pz" (Pz.Cli.csproj's <PackageId>) PLUS one
#      RID sub-package per platform ("pz.linux-x64", "pz.linux-arm64", "pz.win-x64", "pz.osx-arm64",
#      "pz.any" -- hybrid Native AOT packaging, see that csproj), and neither a bare "pz" nor "pz.*"
#      matches the "Pz.*" glob above (globs are case-sensitive). Widen the policy's package list to
#      include "pz" and "pz.*", or add a second policy for them, with the same repository, workflow,
#      environment, and scope. Miss this and the pushes below fail authentication for the tool
#      packages alone, AFTER the library packages have already published -- the tag is then spent and
#      the release is half out.
#   2. Create a GitHub Environment named "release" (repo Settings -> Environments -> New environment) and
#      add an environment secret NUGET_USER = the nuget.org profile name (NOT email) of the account that
#      owns the trusted publishing policy above.
#   3. No NuGet API key secret needs to be stored anywhere -- NuGet/login exchanges this workflow's OIDC
#      token for a short-lived nuget.org API key at run time, scoped to exactly what step 1 configured.
# Until that one-time setup exists, a real `v*` tag push will fail at the NuGet/login step with an
# authentication error -- that failure is expected and does not indicate a workflow bug.
#
# Shape: `changelog-gate` fails fast, before anything is packed, if CHANGELOG.md has no entry for
# the tag. Native AOT cannot cross-compile between OSes, so one `pack-aot` job per platform builds
# that platform's RID sub-package; `verify-release` runs the same three end-to-end proofs PR CI runs
# (scripts/verify-tool-install.sh, verify-aot.sh, verify-sdk-package.sh) against this exact tagged
# commit -- each script packs/publishes its own copy (none takes a "verify this existing artifact"
# parameter), so this is a proof that the tag's commit and MinVer-computed version produce install-
# able, runnable artifacts, not a byte-for-byte check of the .nupkg files `release` pushes below. The
# `release` job builds/tests/packs everything else, then pushes in the order the RID-specific tool
# contract requires -- every sub-package BEFORE the `pz` pointer, because the .NET CLI resolves an
# install through the pointer and fails if a referenced sub-package is not there yet. MinVer computes
# the same version in every job from the same tag, which is what makes the sub-packages and the
# pointer agree (a version mismatch breaks installs).
name: release

on:
  push:
    tags: ['v*']

jobs:
  # Fails fast, before pack-aot or release pack anything, when the tag has no matching CHANGELOG.md
  # entry -- a binding convention (CLAUDE.md: "Every release tag gets a CHANGELOG.md entry") that
  # nothing previously enforced.
  changelog-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-changelog-entry.sh "${GITHUB_REF#refs/tags/}"

  pack-aot:
    needs: changelog-gate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer computes the release version from this tag + history.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet pack src/Pz.Cli -c Release -r ${{ matrix.rid }} -o packages
      - uses: actions/upload-artifact@v4
        with:
          name: pz-${{ matrix.rid }}
          path: packages/pz.${{ matrix.rid }}.*.nupkg
          if-no-files-found: error

  # The same three end-to-end proofs PR CI's pack-and-verify/verify-aot jobs run (identical
  # invocations, toolchain setup, and runner OS), run again here against the exact tagged commit
  # before anything is pushed to nuget.org -- PR CI proved them on the commit that became this tag,
  # but a merge commit or a tag pushed at the wrong ref could otherwise slip an unproven tree out.
  verify-release:
    needs: changelog-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer computes the release version from this tag + history.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: scripts/verify-tool-install.sh
      - run: scripts/verify-aot.sh
      - run: scripts/verify-sdk-package.sh

  release:
    needs: [pack-aot, verify-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release # secret-scopes NUGET_USER to this job; supports required-reviewer gating too.
    permissions:
      contents: read
      id-token: write # required for NuGet/login's OIDC exchange.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer computes the release version from this tag + history.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Pz.slnx -c Release
      # Same test invocation as ci.yml's ubuntu leg, deliberately: PZ_TESTS_OFFLINE=1 for hermeticity
      # and --blame-hang so a stall names itself. Without them a release is *more* fragile than the CI
      # run that already passed on this exact commit -- live-network tests and Docker Testcontainers
      # suites would gate the publish, so a network blip or a failed image pull blocks a release, and a
      # hang would burn the job timeout without saying which test stalled. The offline suites cover the
      # same logic; releasing is not the moment to widen coverage beyond what merge already proved.
      - run: dotnet test Pz.slnx -c Release --no-build --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini
        env:
          PZ_TESTS_OFFLINE: '1'
      # Packs the library packages and the `pz` POINTER (PublishAot in Pz.Cli.csproj means the bare
      # pack emits the pointer, not a runnable tool)...
      - run: dotnet pack Pz.slnx -c Release -o packages --no-build
      # ...and the CoreCLR `any` fallback sub-package, which serves every platform without an AOT
      # build. Cannot use --no-build: packing a RID is a publish.
      - run: dotnet pack src/Pz.Cli -c Release -r any -p:PublishAot=false -o packages
      - uses: actions/download-artifact@v6
        with:
          pattern: pz-*
          path: packages
          merge-multiple: true
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, NOT email -- see prerequisites above.
      # Two pushes, and the order is the contract: every `pz.<rid>`/`pz.any` sub-package and library
      # package must be live before the `pz` pointer is, or an install racing the publish resolves the
      # pointer to a sub-package that is not there yet.
      - name: Push sub-packages and libraries to nuget.org
        run: >
          find packages -name '*.nupkg' ! -regex '.*/pz\.[0-9].*' -print0 |
          xargs -0 -n1 dotnet nuget push
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate
      - name: Push the pz pointer package last
        run: >
          dotnet nuget push packages/pz.[0-9]*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate

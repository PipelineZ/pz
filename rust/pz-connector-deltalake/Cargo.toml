[package]
name = "pz-connector-deltalake"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Delta Lake sink connector for PipelineZ (pz), built on delta-rs."

[[bin]]
name = "pz-deltalake"
path = "src/main.rs"

[dependencies]
pz-connector = { path = "../pz-connector" }
# "datafusion" is required for anything beyond a bare append: `DeltaTable::write`/`DeltaTable::merge`
# are only defined under that feature gate (delta-rs 0.32's operations/mod.rs), because `merge`'s
# source side is a `datafusion::prelude::DataFrame` and `write`'s overwrite path reuses the same
# query engine to plan the atomic remove+add. Pinned to the same "58" arrow major as pz-connector
# (see that crate's Cargo.toml) so the RecordBatch/SchemaRef crossing the SinkConnector/Sink/
# WriteSession trait boundary is one type, not two versions needing FFI bridging.
deltalake = { version = "0.32", features = ["datafusion"] }
arrow = { version = "58", default-features = false, features = ["ipc"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

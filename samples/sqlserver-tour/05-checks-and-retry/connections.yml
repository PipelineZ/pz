erp:
  connector: sqlserver
  host: ${PZ_MSSQL_HOST}
  port: 14333
  database: ${PZ_MSSQL_DB}
  user: ${PZ_MSSQL_USER}
  password: ${PZ_MSSQL_PASSWORD}
  trust_server_certificate: true
  entities:
    dbo.orders:
      read:
        columns:
          order_id: bigint
          customer_id: int
          amount: decimal
          status: varchar
          updated_at: timestamp
  retry:
    max_attempts: 3
    base_delay: 1s

mart:
  connector: sqlserver
  host: ${PZ_MSSQL_HOST}
  port: 14333
  database: ${PZ_MSSQL_DB}
  user: ${PZ_MSSQL_USER}
  password: ${PZ_MSSQL_PASSWORD}
  trust_server_certificate: true

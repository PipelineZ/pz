[package]
name = "pz-connector"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "SDK for writing PipelineZ (pz) out-of-process connectors (PCP) in Rust."

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
# arrow-rs treats every release as a new major version, so two different pins never unify in one
# Cargo.lock: the RecordBatch/SchemaRef types this crate's trait surface exposes would silently
# stop being the same nominal type as the ones a downstream connector crate produces. Any future
# connector added to this workspace must pin the same arrow major to stay free of cross-version
# Arrow FFI bridging code.
arrow = { version = "60", default-features = false, features = ["ipc"] }
async-trait = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
getrandom = "0.4"
anyhow = "1"
thiserror = "2"

# Telemetry: the host hands an OTLP endpoint in HostInfo; spans (`tracing`) and meters are exported
# from this process directly. The otlp crate's tonic/prost transitive deps MUST resolve to the tonic
# and prost versions pinned above -- exactly one tonic and one prost may appear in Cargo.lock.
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace", "metrics"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std", "fmt"] }
tracing-opentelemetry = "0.33"
tower-http = { version = "0.7", features = ["trace"] }
http = "1"

# The PCP transport is AF_UNIX everywhere; tokio has no AF_UNIX types on Windows, so the socket is
# created, bound and accepted through socket2 there, and a blocked read is cancelled through
# CancelIoEx (src/transport.rs). Both are already in the tree via tokio.
[target.'cfg(windows)'.dependencies]
socket2 = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3"
# test-util (tokio::time::pause/advance) is deliberately not enabled in [dependencies] -- it changes
# the runtime's own clock behavior, and no code this crate ships to connector authors may depend on
# that. Tests get it because Cargo unifies feature sets across dependency/dev-dependency edges of the
# same crate for test builds only.
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
tonic-prost-build = "0.14"

[[example]]
name = "memory_sink"
path = "examples/memory_sink.rs"
